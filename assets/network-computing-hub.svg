<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Network Computing Hub</title>
  <!-- A hub with three machines on it. Endpoint colours are the shipped protocol
       colours (RDP green, VNC blue, Radmin orange), so the icon reads the way the
       connection list does. The hexagon hub sits off to the right and the spokes
       differ in length and angle on purpose: an evenly spaced fan looked like a
       diagram, this looks like a network. Layout runs corner to corner to leave
       as little dead space as the rounded plate allows. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a424b"/>
      <stop offset="1" stop-color="#242a30"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d1d9"/>
    </linearGradient>
    <!-- the >_ prompt, one definition reused in every box -->
    <g id="prompt" stroke="#ffffff" stroke-width="2.6" fill="none"
       stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
      <polyline points="9.5,8.5 15,12.9 9.5,17.3"/>
      <line x1="18" y1="17.8" x2="26" y2="17.8"/>
    </g>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>

  <!-- spokes, drawn first so the nodes sit on top -->
  <g stroke="#8b949e" stroke-width="6" stroke-linecap="round">
    <line x1="91" y1="64" x2="29" y2="25"/>
    <line x1="91" y1="64" x2="25" y2="73"/>
    <line x1="91" y1="64" x2="47" y2="107"/>
  </g>

  <!-- machines: far, near and mid, at three different angles -->
  <g>
    <rect x="12" y="12" width="34" height="26" rx="5.5" fill="#4e9a25"/>
    <use href="#prompt" x="12" y="12"/>

    <rect x="8" y="60" width="34" height="26" rx="5.5" fill="#d97a1f"/>
    <use href="#prompt" x="8" y="60"/>

    <rect x="30" y="94" width="34" height="26" rx="5.5" fill="#2b6cb0"/>
    <use href="#prompt" x="30" y="94"/>
  </g>

  <!-- the hub itself -->
  <polygon points="116,64 103.5,85.65 78.5,85.65 66,64 78.5,42.35 103.5,42.35"
           fill="url(#hub)"/>
  <polygon points="101,64 96,72.66 86,72.66 81,64 86,55.34 96,55.34" fill="#2b3138"/>
</svg>
