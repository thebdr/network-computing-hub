<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Network Computing Hub</title>
  <!-- A hub with three machines on it. Endpoint colours are the shipped protocol
       colours (RDP green, VNC blue, Radmin orange), so the icon reads the way the
       connection list does. The hexagon stands on a vertical face, off to the
       right; spokes differ in length and angle on purpose. The plate corners are
       squarer than before (rx 20) so the enlarged boxes can reach into them. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a424b"/>
      <stop offset="1" stop-color="#242a30"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d1d9"/>
    </linearGradient>
    <!-- the >_ prompt, one definition reused in every box -->
    <g id="prompt" stroke="#ffffff" stroke-width="3" fill="none"
       stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
      <polyline points="11,10 17.5,15.2 11,20.4"/>
      <line x1="21" y1="20.9" x2="30" y2="20.9"/>
    </g>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="20" fill="url(#bg)"/>

  <!-- spokes, drawn first so the nodes sit on top -->
  <g stroke="#8b949e" stroke-width="7" stroke-linecap="round">
    <line x1="92" y1="64" x2="32" y2="24"/>
    <line x1="92" y1="64" x2="27" y2="71"/>
    <line x1="92" y1="64" x2="50" y2="105"/>
  </g>

  <!-- machines: far, near and mid, at three different angles -->
  <g>
    <rect x="12" y="9" width="40" height="30" rx="6" fill="#4e9a25"/>
    <use href="#prompt" x="12" y="9"/>

    <rect x="7" y="56" width="40" height="30" rx="6" fill="#d97a1f"/>
    <use href="#prompt" x="7" y="56"/>

    <rect x="30" y="90" width="40" height="30" rx="6" fill="#2b6cb0"/>
    <use href="#prompt" x="30" y="90"/>
  </g>

  <!-- the hub: a hexagon standing on a vertical face -->
  <polygon points="92,35 117.1,49.5 117.1,78.5 92,93 66.9,78.5 66.9,49.5"
           fill="url(#hub)"/>
  <polygon points="92,52 102.4,58 102.4,70 92,76 81.6,70 81.6,58" fill="#2b3138"/>
</svg>
