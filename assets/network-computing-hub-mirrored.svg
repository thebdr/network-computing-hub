<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Network Computing Hub (mirrored)</title>
  <!-- Mirror of the main icon: hub on the left, machines fanning right. Flipped
       by coordinates rather than transform, so the >_ prompts still read left
       to right. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a424b"/>
      <stop offset="1" stop-color="#242a30"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d1d9"/>
    </linearGradient>
    <g id="prompt" stroke="#ffffff" stroke-width="3" fill="none"
       stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
      <polyline points="11,10 17.5,15.2 11,20.4"/>
      <line x1="21" y1="20.9" x2="30" y2="20.9"/>
    </g>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="20" fill="url(#bg)"/>

  <g stroke="#8b949e" stroke-width="7" stroke-linecap="round">
    <line x1="36" y1="64" x2="96" y2="24"/>
    <line x1="36" y1="64" x2="101" y2="71"/>
    <line x1="36" y1="64" x2="78" y2="105"/>
  </g>

  <g>
    <rect x="76" y="9" width="40" height="30" rx="6" fill="#4e9a25"/>
    <use href="#prompt" x="76" y="9"/>

    <rect x="81" y="56" width="40" height="30" rx="6" fill="#d97a1f"/>
    <use href="#prompt" x="81" y="56"/>

    <rect x="58" y="90" width="40" height="30" rx="6" fill="#2b6cb0"/>
    <use href="#prompt" x="58" y="90"/>
  </g>

  <polygon points="36,35 10.9,49.5 10.9,78.5 36,93 61.1,78.5 61.1,49.5"
           fill="url(#hub)"/>
  <polygon points="36,52 25.6,58 25.6,70 36,76 46.4,70 46.4,58" fill="#2b3138"/>
</svg>
