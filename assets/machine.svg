<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">
  <!-- One machine in Browse's icon view: a monitor showing a classic desktop
       (sky, a green hill, a blue taskbar with a green start button). The
       protocol chips are laid over the screen, between y=7 and the taskbar
       at y=65; rcm_gui.py's MACHINE_SCREEN keeps those numbers. -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5361"/>
      <stop offset="1" stop-color="#2a2f38"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c58c9"/>
      <stop offset="0.6" stop-color="#5a9be8"/>
      <stop offset="1" stop-color="#b3d8f8"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74c64f"/>
      <stop offset="1" stop-color="#2d8429"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4183ec"/>
      <stop offset="0.45" stop-color="#245edb"/>
      <stop offset="1" stop-color="#1a43a8"/>
    </linearGradient>
    <linearGradient id="start" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc456"/>
      <stop offset="1" stop-color="#2b8a28"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a717e"/>
      <stop offset="1" stop-color="#454b56"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="7" y="7" width="106" height="64" rx="2"/>
    </clipPath>
  </defs>

  <path d="M50 78 H70 L73 91 H47 Z" fill="url(#stand)"/>
  <rect x="33" y="89.5" width="54" height="7.5" rx="3.75" fill="#3f4550"/>
  <rect x="1.5" y="1.5" width="117" height="78" rx="6" fill="url(#bezel)"
        stroke="#1b1f26"/>

  <g clip-path="url(#screen)">
    <rect x="7" y="7" width="106" height="64" fill="url(#sky)"/>
    <ellipse cx="33" cy="20" rx="15" ry="3.5" fill="#ffffff" opacity="0.35"/>
    <ellipse cx="84" cy="15" rx="19" ry="4.5" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="96" cy="27" rx="10" ry="2.5" fill="#ffffff" opacity="0.25"/>
    <path d="M7 55 C30 41 64 38 113 51 V71 H7 Z" fill="url(#hill)"/>
    <rect x="7" y="65" width="106" height="6" fill="url(#bar)"/>
    <path d="M7 65 H24 Q27 65 27 68 Q27 71 24 71 H7 Z" fill="url(#start)"/>
    <rect x="101" y="65" width="12" height="6" fill="#1294e8" opacity="0.85"/>
  </g>
  <rect x="7" y="7" width="106" height="64" rx="2" fill="none" stroke="#10141a"/>
  <circle cx="110.5" cy="75.3" r="1.3" fill="#7be27b"/>
</svg>
