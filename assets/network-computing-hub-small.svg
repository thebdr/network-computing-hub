<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Network Computing Hub</title>
  <!-- Small-size variant. Same idea, far fewer elements: at 16-32px the screen
       shapes and their highlights turn to mush, so the machines become plain
       discs and the spokes get much heavier. -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#2f363e"/>
  <g stroke="#9aa4ae" stroke-width="10" stroke-linecap="round">
    <line x1="64" y1="64" x2="64" y2="30"/>
    <line x1="64" y1="64" x2="93" y2="81"/>
    <line x1="64" y1="64" x2="35" y2="81"/>
  </g>
  <circle cx="64" cy="26" r="18" fill="#4e9a25"/>
  <circle cx="99" cy="86" r="18" fill="#2b6cb0"/>
  <circle cx="29" cy="86" r="18" fill="#d97a1f"/>
  <circle cx="64" cy="64" r="19" fill="#ffffff"/>
  <circle cx="64" cy="64" r="8" fill="#2f363e"/>
</svg>
